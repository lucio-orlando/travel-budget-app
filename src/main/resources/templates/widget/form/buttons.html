<div th:fragment="formButtons(backRoute, saveText, backText, backIcon)"
     style="display: flex; justify-content: space-between">

    <a class="btn btn-outline-secondary" th:href="${backRoute}">
        <i th:data-lucide="${backIcon}"></i>
        <span th:text="${backText}">Back</span>
    </a>

    <button class="btn btn-primary" type="submit" th:text="${saveText}">Save</button>
</div>

<div th:fragment="formButtonsDefault(backRoute)"
     style="display: flex; justify-content: space-between">

    <a class="btn btn-outline-secondary" th:href="${backRoute}">
        <span>Back</span>
    </a>

    <button class="btn btn-primary" type="submit">Save</button>
</div>
