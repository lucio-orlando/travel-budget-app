<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::title}, ~{::content})}">

<th:block th:fragment="title">
    Stats
</th:block>

<th:block th:fragment="content">
    <script th:src="@{/assets/js/plugins/chart.umd.js}"></script>

    <div class="row">
        <div class="col-12 col-lg-6">
            <h2>Categories</h2>
            <div class="chart">
                <canvas id="categoryChart"></canvas>
            </div>
        </div>
        <div class="col-12 col-lg-6">
            <h2>Weekly spending's</h2>
            <div class="chart">
                <canvas id="weeklyChart"></canvas>
            </div>
        </div>
    </div>

    <script th:inline="javascript">
        /*<![CDATA[*/
        const categoryStats = JSON.parse(/*[[${categoryStats}]]*/ "[]");

        const parentLabels = categoryStats.map(group => group.parent);

        // Get all unique child names to create datasets
        const childNames = [...new Set(categoryStats.flatMap(group => group.children.map(child => child.name)))];

        const datasets = childNames.map(childName => ({
            label: childName,
            data: categoryStats.map(group => {
                const match = group.children.find(child => child.name === childName);
                return match ? match.total : 0;
            }),
            stack: 'stack1'
        }));

        const ctx = document.getElementById('categoryChart').getContext('2d');
        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: parentLabels,
                datasets: datasets
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    title: {
                        display: true,
                        text: 'Stacked Expenses per Parent Category'
                    },
                    tooltip: {
                        callbacks: {
                            label: function(context) {
                                const value = context.raw;
                                if (value === 0) {
                                    return null;
                                }
                                const label = context.dataset.label || '';
                                const formatted = new Intl.NumberFormat('de-CH', {
                                    minimumFractionDigits: 2,
                                    maximumFractionDigits: 2
                                }).format(value);
                                return `${label}: ${formatted} CHF`;
                            }
                        }
                    }
                },
                interaction: {
                    mode: 'index',
                    intersect: false
                },
                scales: {
                    x: {
                        stacked: true
                    },
                    y: {
                        stacked: true,
                        title: {
                            display: true,
                            text: 'CHF'
                        }
                    }
                }
            }
        });



        const weeklyStats = JSON.parse(/*[[${weeklyStats}]]*/ "[]");

        const weeklyLabels = weeklyStats.map(entry => entry.name);
        const weeklyData = weeklyStats.map(entry => entry.total);

        const dailyCtx = document.getElementById('weeklyChart').getContext('2d');
        new Chart(dailyCtx, {
            type: 'line',
            data: {
                labels: weeklyLabels,
                datasets: [{
                    label: 'CHF Spent',
                    data: weeklyData,
                    fill: false,
                    tension: 0,
                    borderWidth: 2
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    x: {
                        title: {
                            display: true,
                            text: 'Date'
                        }
                    },
                    y: {
                        title: {
                            display: true,
                            text: 'CHF'
                        }
                    }
                },
                plugins: {
                    title: {
                        display: true,
                        text: 'Total Spending per Week'
                    }
                }
            }
        });
        /*]]>*/
    </script>

    <div th:replace="~{widget/back-button :: backButton('/')}"></div>

    <div th:replace="~{widget/bottom-nav :: tabNavDefault('/', '/trip/new')}"></div>
</th:block>
</html>
